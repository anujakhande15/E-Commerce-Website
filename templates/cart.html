<!DOCTYPE html>
<html>

<head>

    <title>Cart</title>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

    <nav>

        <h1>My Cart</h1>

        <ul>

            <li>
                <a href="/" style="color:white;">
                    Home
                </a>
            </li>

        </ul>

    </nav>

    <div class="cart-container">

        <h2>Shopping Cart</h2>

        {% for item in cart %}

        <div class="cart-item">

            <img src="{{ url_for('static',
            filename='images/' + item.image) }}">

            <div>

                <h3>{{ item.name }}</h3>

                <p>₹{{ item.price }}</p>

            </div>

            <a href="/remove/{{ loop.index0 }}">

                <button>Remove</button>

            </a>

        </div>

        {% endfor %}

        <h2>Total: ₹{{ total }}</h2>

        <a href="/checkout">
            
            <button>Checkout</button>
        </a>

    </div>

</body>
</html>
