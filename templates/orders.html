<!DOCTYPE html>
<html>

<head>

    <title>My Orders</title>

    <link rel="stylesheet"
    href="{{ url_for(
    'static',
    filename='css/style.css'
    ) }}">

</head>

<body>

    <div class="orders-container">

        <h2>

            My Orders

        </h2>

        <table>

            <tr>

                <th>

                    ID

                </th>

                <th>

                    Product

                </th>

                <th>

                    Price

                </th>

                <th>

                    Total Amount

                </th>

                <th>

                    Payment Method

                </th>

                <th>

                    Payment Status

                </th>

                <th>

                    Date

                </th>

            </tr>

            {% for order in orders %}

            <tr>

                <td>

                    {{ order.id }}

                </td>

                <td>

                    {{ order.product_name }}

                </td>

                <td>

                    ₹{{ order.price }}

                </td>

                <td>

                    ₹{{ order.total_amount }}

                </td>

                <td>

                    {{ order.payment_method }}

                </td>

                <td>

                    {{ order.payment_status }}

                </td>

                <td>

                    {{ order.order_date }}

                </td>

            </tr>

            {% endfor %}

        </table>

        <br>

        <a href="/">

            <button>

                Continue Shopping

            </button>

        </a>

    </div>

</body>

</html>
