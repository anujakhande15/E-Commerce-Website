<!DOCTYPE html>
<html>

<head>

    <title>Edit Product</title>

    <link rel="stylesheet"
    href="{{ url_for('static',
    filename='css/style.css') }}">

</head>

<body>

    <div class="form-container">

        <form method="POST">

            <h2>Edit Product</h2>

            <input type="text"
            name="name"
            value="{{ product.name }}"
            required>

            <input type="number"
            name="price"
            value="{{ product.price }}"
            required>

            <input type="text"
            name="image"
            value="{{ product.image }}"
            required>

            <textarea
            name="description">

{{ product.description }}

            </textarea>

            <button type="submit">

                Update Product

            </button>

        </form>

    </div>

</body>
</html>
