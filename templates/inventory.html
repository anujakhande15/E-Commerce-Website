<!DOCTYPE html>
<html>

<head>

<title>

Inventory

</title>

</head>

<body>

<h1>

Inventory Management

</h1>

<table border="1">

<tr>

<th>ID</th>

<th>Name</th>

<th>Stock</th>

</tr>

{% for product in products %}

<tr>

<td>

{{ product.id }}

</td>

<td>

{{ product.name }}

</td>

<td>

{{ product.stock }}

</td>

</tr>

{% endfor %}

</table>

</body>

</html>
